# Release: the merge of a release pull request (`just release-patch`: version
# bump, title `release widget-mapbox <version>`) publishes the package to npm, then
# sets the tag <version> (a bare version; a tag always means "on npm") and
# creates the GitHub release, both with the release GitHub App's token. Main
# accepts only pull requests whose required checks (ci-ok, security / report)
# passed, so every release comes from a merged, fully green commit; nothing is
# published or tagged from a laptop.
# The file keeps its old name because npm's trusted publisher of the package
# names it (IronFlock/widget-mapbox :: build-publish.yml).
# A no-release merge starts nothing: `paths` holds only the version file, and
# when a no-release pull request touches it anyway (a dependency) the jobs
# below are skipped by its merge title, so no runner starts.
# ci.yml calls it on release pull requests (workflow_call), and run by hand
# (workflow_dispatch) it is a dry run: `npm publish --dry-run`, no tag.
# A re-run is safe: a version already on npm is not published again.
name: release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'release ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # the OIDC token npm exchanges for publish rights (trusted publishing,
      # bound to this file)
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # npm >= 11.5.1 for trusted publishing; Node 24.20.0 bundles npm 11.19.0.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"
          # A publishing run never restores a cache another run could have written.
          package-manager-cache: false
      - run: npm ci
      # Puts the version into the element name (widget-<name>-<version>).
      - run: npm run build
      # No .npmrc, no NPM_TOKEN: npm detects the OIDC environment and
      # authenticates against the trusted publisher of this package.
      - name: npm publish
        env:
          PUBLISH: ${{ github.event_name == 'push' }}
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          if [ "$PUBLISH" != true ]; then
            npm publish --access public --dry-run
          elif [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm"
          else
            npm publish --access public
          fi

  # The tag once the package is on npm, with the release GitHub App's token
  # from the `release` environment (deployments from main only).
  tag:
    needs: [npm]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release ')
    uses: IronFlock/workflows/.github/workflows/release-tag.yml@v1
    permissions:
      contents: read
    # The App key is a secret of the `release` environment; environment
    # secrets reach a reusable workflow only through `secrets: inherit`.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      version-file: package.json
      tag-prefix: ""
      # The GitHub release of the tag, with the same App token.
      github-release: true
