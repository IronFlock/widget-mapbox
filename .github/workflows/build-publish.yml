name: Build and Publish to npm and unpkg

on:
  push:
    tags:
      - "*"

# id-token lets the runner mint the OIDC token npm exchanges for publish rights.
# Without it `npm publish` looks for a token and fails.
permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Pinned, not "24": npm trusted publishing needs npm >= 11.5.1, and the
      # npm bundled with a Node line is not something we want floating.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No .npmrc, no NPM_TOKEN. npm detects the OIDC environment and
      # authenticates against the trusted publisher configured for this
      # package (IronFlock/widget-mapbox :: build-publish.yml).
      - name: Publish to npm
        run: npm publish --access public

      - name: Get the new version
        id: get_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.get_version.outputs.version }}" \
            --title "Release ${{ steps.get_version.outputs.version }}" \
            --generate-notes
