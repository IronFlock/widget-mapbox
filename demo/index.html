<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <title>Mapbox</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background-color: #f5f5f5;
                font-family:
                    Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
                --font-family-serif: Helvetica;
                color: #291f42;
                font-weight: 400;
                line-height: 1.5;
                min-height: 100vh;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            * {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>

    <body>
        <div id="demo"></div>
        <script src="https://storage.googleapis.com/reswarm-images/ObjectRandomizer.js"></script>

        <script type="module">
            import { render } from 'lit'
            import { html, unsafeStatic } from 'lit/static-html.js'
            const packageJson = await fetch('../package.json').then((res) => res.json())
            const tag = unsafeStatic(`widget-mapbox-${packageJson.version}`)
            import '../dist/widget-mapbox.js'
            const data = await fetch('../src/default-data.json').then((res) => res.json())
            const themeObject = await fetch('themes/light.json').then((res) => res.json())
            const theme = { theme_name: 'light', theme_object: themeObject }
            // The built-in token only works on studio.ironflock.com. To see tiles locally, open
            // /demo/?token=<a Mapbox token that allows localhost>, e.g. studio's development token.
            const accessToken = new URLSearchParams(location.search).get('token') ?? undefined
            render(
                html`
                    <${tag} .theme="${theme}" .inputData=${data} .accessToken=${accessToken}>
                        web component is not registered. Make sure to use the tag with the correct version
                        string from the package.json
                    </${tag}>
                `,
                document.getElementById('demo')
            )
            const widget = document.getElementById('demo').children[0]
            const keyPathsToRandomize = [
                'dataseries.0.data.1.value',
                'dataseries.0.data.5.value',
                'dataseries.0.data.2.value',
                'dataseries.0.data.7.value',

                'dataseries.1.data.0.value',
                'dataseries.1.data.1.value',
                'dataseries.1.data.2.value',
                'dataseries.1.data.3.value',
                'dataseries.1.data.4.value',
                'dataseries.1.data.5.value',
                'dataseries.1.data.6.value',
                'dataseries.1.data.7.value',
                'dataseries.1.data.8.value',
                'dataseries.1.data.9.value',
                'dataseries.1.data.10.value',
                'dataseries.1.data.11.value',
                'dataseries.1.data.12.value',
                'dataseries.1.data.13.value',
                'dataseries.1.data.14.value',
                'dataseries.1.data.15.value'
            ]
            const inter = setInterval(() => {
                const randomizedObj = randomizeObjectValues(data, keyPathsToRandomize)

                // console.log('random', randomizedObj.dataseries[0].data[0])
                widget.inputData = randomizedObj
                // clearInterval(inter)
            }, 1000)
        </script>
    </body>
</html>
